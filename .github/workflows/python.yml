name: Python package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  installed-package:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install package
        run: python -m pip install ".[test]"
      - name: Test installed package outside checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c 'import sounio; assert "site-packages" in sounio.__file__, sounio.__file__'
          python -m pytest "$GITHUB_WORKSPACE/tests" -q
      - name: Install optional native extension
        run: python -m pip install ./native
      - name: Test with native extension installed
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c 'import sounio.native'
          python -m pytest "$GITHUB_WORKSPACE/tests" -q
