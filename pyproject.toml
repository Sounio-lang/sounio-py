[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sounio"
version = "0.2.0"
description = "Python interface for the Sounio epistemic programming language"
readme = "README.md"
authors = [{name = "Sounio Team", email = "team@sounio.dev"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
keywords = ["sounio", "epistemic", "uncertainty", "scientific-computing", "pharmacokinetics"]

[project.urls]
Homepage = "https://github.com/Sounio-lang/sounio"
Documentation = "https://github.com/Sounio-lang/sounio/blob/main/docs/LLM_PROGRAMMING_GUIDE.md"
Repository = "https://github.com/Sounio-lang/sounio"

[tool.setuptools.packages.find]
include = ["sounio*"]
